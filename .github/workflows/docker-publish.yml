name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUBDEMO_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./AirConditionerService
          push: true
          tags: koushik32964/docker-backend-2400032964:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./AirConditionerService-Frontend
          push: true
          tags: koushik32964/docker-frontend-2400032964:latest
